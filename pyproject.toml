[project]
name = "curegenix-quantum"
version = "0.1.0"
description = "Quantum computing module for CureGenix"
requires-python = ">=3.12"

dependencies = [
    "mcp[cli]==2.3.0",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-algorithms==0.4.0",
    "qiskit-nature==0.8.0",
    "pyscf==2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantum"]