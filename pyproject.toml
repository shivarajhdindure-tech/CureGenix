[project]
name = "curegenix-quantum"
version = "0.1.0"
description = "Quantum computing module for CureGenix"
requires-python = ">=3.12,<3.13"

dependencies = [
    "mcp[cli]==2.3.0",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-algorithms==0.4.0",
    "qiskit-nature==0.8.0",
    "pyscf==2.14.0",
    "qiskit-optimization>=0.7.0",
    "fastapi==0.115.0",
    "uvicorn>=0.31.1,<1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rdkit>=2024.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantum"]
